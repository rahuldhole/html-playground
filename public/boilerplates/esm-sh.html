<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>esm.sh No-Build Boilerplate</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 1rem;
      color: #1f2937;
    }
    .card {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    button {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover {
      background: #4338ca;
    }
    pre {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
    }
  </style>
  <script type="module">
    // Importing npm packages directly via esm.sh without any bundler or build step!
    import confetti from 'https://esm.sh/canvas-confetti@1.9.4';
    import dayjs from 'https://esm.sh/dayjs@1.11.13';

    const timeEl = document.getElementById('time');
    const btn = document.getElementById('btn');

    timeEl.textContent = dayjs().format('dddd, MMMM D, YYYY h:mm:ss A');

    btn.addEventListener('click', () => {
      confetti({
        particleCount: 80,
        spread: 60,
        origin: { y: 0.6 }
      });
    });
  </script>
</head>
<body>
  <div class="card">
    <h2>⚡ esm.sh No-Build Demo</h2>
    <p>Loaded packages <code>canvas-confetti</code> and <code>dayjs</code> natively via modern ES Modules from <strong>esm.sh</strong> without bundlers (Vite/Webpack/Babel).</p>
    <p><strong>Current Time:</strong> <span id="time">Loading...</span></p>
    <button id="btn">Trigger Confetti 🎉</button>
  </div>
</body>
</html>
