<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twind JIT Tailwind Boilerplate</title>
  <script type="module">
    // Twind runtime Tailwind compiler via esm.sh
    import { install } from 'https://esm.sh/@twind/core@1.1.3';
    import presetAutoprefix from 'https://esm.sh/@twind/preset-autoprefix@1.0.7';
    import presetTailwind from 'https://esm.sh/@twind/preset-tailwind@1.1.4';

    // Initialize Twind
    install({
      presets: [presetAutoprefix(), presetTailwind()],
      darkMode: 'class',
    });
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full bg-slate-800/80 backdrop-blur border border-slate-700/60 p-6 rounded-2xl shadow-2xl">
    <div class="flex items-center space-x-3 mb-4">
      <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-500 flex items-center justify-center text-white text-lg font-bold">
        ⚡
      </div>
      <div>
        <h2 class="text-xl font-bold text-white">Twind (JIT Tailwind)</h2>
        <p class="text-xs text-slate-400">Zero-build runtime CSS via esm.sh</p>
      </div>
    </div>
    <p class="text-slate-300 text-sm leading-relaxed mb-4">
      Twind compiles utility classes into CSS on-the-fly directly in the browser with full Tailwind CSS support and small runtime footprint.
    </p>
    <div class="flex gap-2">
      <button class="px-4 py-2 bg-cyan-500 hover:bg-cyan-600 active:scale-95 transition-all text-white font-medium text-sm rounded-lg shadow-lg shadow-cyan-500/25">
        Interactive JIT Button
      </button>
      <button class="px-4 py-2 border border-slate-600 hover:bg-slate-700 active:scale-95 transition-all text-slate-300 font-medium text-sm rounded-lg">
        Twind Core
      </button>
    </div>
  </div>
</body>
</html>
